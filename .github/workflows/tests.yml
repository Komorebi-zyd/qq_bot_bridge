name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: local-ci-test-password
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_test -d bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDGE_TEST_POSTGRES_URL: postgresql://bridge_test:local-ci-test-password@127.0.0.1:5432/bridge_test?sslmode=disable
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q -p no:cacheprovider
